# Render.com Blueprint for MindMittel V2
services:
  - type: web
    name: mindmittel2
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DB_NAME
        value: mindmittel_v2
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: SYSTEM_DASHBOARD_TOKEN
        sync: false
